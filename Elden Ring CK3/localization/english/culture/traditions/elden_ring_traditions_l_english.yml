l_english:

 tradition_hornsent_spiral_name:0 "Hornsent"
 tradition_hornsent_spiral_desc:0 "The Crucible is great and powerful, and with the correct metods we can be closer to it, blessed by the power of the divine, and with dance we can manifest it."
 culture_parameter_convert_crucible_to_spiral:0 "Children that were suposed to be born with [GetTrait('crucible_affinity').GetName( GetNullCharacter )] will be born with [GetTrait('spiral_affinity').GetName( GetNullCharacter )] instead, and Spiral Affinity will be more common."

 tradition_carian_royal_name:0 "Carian Royalty"
 tradition_carian_royal_desc:0 "We learned to watch the stars and study them, they hide great power, and we will imitate them with our sorceries."
 culture_parameter_glintstone_affinity_more_common:0 "[GetTrait('glintstone_affinity').GetName( GetNullCharacter )] will be more common in births."

 tradition_golden_order_name:0 "Order"
 tradition_golden_order_desc:0 "There is one god, and they walk among us, their word is law and they gifted us with eternal life, may their order last forever and ever!"
 culture_parameter_order_affinity_more_common:0 "[GetTrait('order_affinity').GetName( GetNullCharacter )] will be more common in births."

 tradition_giants_fire_name:0 "Giants' Flame"
 tradition_giants_fire_desc:0 "Long ago the Giants walked in this world, they are gone, but we learned to imitate their connection to the Flame, some of us may even have a drop of their blood."
 culture_parameter_giants_and_fire_at_birth:0 "[GetTrait('fire_affinity').GetName( GetNullCharacter )] and [GetTrait('giant').GetName( GetNullCharacter )] are more common in births."

 tradition_stormlords_name:0 "Stormlords of Old"
 tradition_stormlords_desc:0 "Our lands were once ruled by lords of storm and war. While those ages may be long gone, our people are still nonetheless ferocious."
 culture_parameter_aggressive_attacker_trait_more_common:0 "The [GetTrait('aggressive_attacker').GetName( GetNullCharacter )] is more common."
 culture_parameter_wrathful_trait_more_common:0 "The [GetTrait('wrathful').GetName( GetNullCharacter )] is more common."
 culture_parameter_unlock_maa_banished_knights:0 "Can recruit [GetMaA('banished_knights').GetName] as [men_at_arms|E]"

 tradition_crucible_knight_name:0 "Aspects of the crucible"
 tradition_crucible_knight_desc:0 "The Crucible was once the matter where all life blended together, and attuning to it enables one to gain the abilities of beasts and utilize them to their fullest potential. However, there are some who were influenced by its primordial influence at birth and now exhibit physical malformations, be it horns, tails or wings."

 tradition_rotborn_name:0 "Rotborn"
 tradition_rotborn_desc:0 "While others quake in fear of it, we see the Rot for what it truly is; a force of nature among a thousand others that gives as much as it takes. Everything must eventually rot, though by learning to channel this divine power we can wield it instead of succumbing to it."
 culture_parameter_scarletrot_at_birth:0 "Children might be born with a form of Scarlet Rot."

 tradition_liurnian_scholarship_name:0 "Liurnian Scholarship"
 tradition_liurnian_scholarship_desc:0 "The Academy of Raya Lucraria stood long before the rule of the Carian nobles. Immersed in scholarly traditions, the knowledge and scholarly prowess are still valued to this day."
 
 tradition_ancestral_follower_name:0 "Ancentral Followers"
 tradition_ancestral_follower_desc:0 "The ancestral followers believe that the horns of a long-lived beast continue to bud like antlers, over and over again, until the beast one day becomes an ancestral spirit."
 
 tradition_bayle_followers_name:0 "Followers of Bayle"
 tradition_bayle_followers_desc:0 "The black drake Bayle fought against the dragon lord Placidusax, we forgot why that conflict began, but we still remembered why we sided with Bayle, the promise of power."
 
 tradition_beast_clergy_name:0 "Beast Clergy"
 tradition_beast_clergy_desc:0 "The ancient teachings of the beastmen teaches us how to gain power and intellect, Having gained intelligence, the beasts must have felt how their wildness slipped away as civilization took hold."
 culture_parameter_prowess_from_learning_education:0 "Learning traits give prowess"
 
 tradition_blood_of_landsbetween_name:0 "Blood of the Lands Between"
 tradition_blood_of_landsbetween_desc:0 "While there are many different kinds of people in the Lands Between, we were all united for the great crusade in the Land of Shadow. No matter where you came from as long as you fought for the Golden Order."
 
 tradition_cerulean_coast_name:0 "Cerulean Coast"
 tradition_cerulean_coast_desc:0 "In the south-west of the land of shadows there is a beautiful land filled with Red and Blue flowers. This place we call our home is filled with corpses and dreams of a future that will never come."
 culture_parameter_sleep_affinity_more_common:0 "[GetTrait('sleep_cleric').GetName( GetNullCharacter )] is stronger and gives bonuses."
 
 tradition_crucible_knights_name:0 "Crucible Knights"
 tradition_crucible_knights_desc:0 "The Crucible Knights were an ancient order of warriors devoted to the primordial Crucible of life, Much like the Crucible they venerated, the Crucible Knights possessed the ability to manifest the forms of various beasts. It is said the vitalic power they drew from inhabited their very armor."
 culture_parameter_honor_crucible_knights:0 "We venerate those that get the honor of being a [GetTrait('crucible_knight').GetName( GetNullCharacter )]."
 
 tradition_dancer_ranah_name:0 "Dancers of Ranah"
 tradition_dancer_ranah_desc:0 "The dance of Ranah is one of burning passion, and the most passionate dancers never allow their fiery dance to end, losing even their names as they dance on. The passionate dance comprises no seductiveness, but merely a dignified beauty."
 
 tradition_dragon_communion_name:0 "Dragon Communion Partakers"
 tradition_dragon_communion_desc:0 "Dragon Communion was teached to us by the ancient dragons. Lord Placidusax ordered these techniques to be teached to ambitious warriors, so that we might hunt the drakes to the last, and bring defeat to Bayle the Dread.\n\n'Indeed, Dragon Communion is too primal in nature for the term 'incantation' to be appropriate.'"
 
 tradition_frenzied_flame_name:0 "Guided by Frenzy"
 tradition_frenzied_flame_desc:0 "Incinerate all that divides and distinguishes. Ahhh, may chaos take the world!"
 culture_parameter_frenzied_flame_at_birth:0 "Newborns might be blessed by the frenzy."
 
 tradition_zamor_name:0 "Knights of Zamor"
 tradition_zamor_desc:0 "We are the warriors of frost, of our town in the frozen mountains. Fire giants are our enemies, for they represent everything that opposes us, and we will hunt them until they disappear."
 
 tradition_mt_gelmir_name:0 "Knights of Gelmir"
 tradition_mt_gelmir_desc:0 "Mt. Gelmir is characterized by sheer cliffs and ominous skies. We have learned to live in this isolated place, and not only succeed but thrive. Some say a great serpent sleeps in the heart of the volcano."
 
 tradition_red_manes_name:0 "Redmanes"
 tradition_red_manes_desc:0 "The Redmanes are the fiercely loyal armies of General Radahn. They are based in Caelid, with Redmane Castle serving as their headquarters. After many years, they have become masters at fighting against Scarlet Rot.\n\n'Alas, dear home, I shan't see you again! For it is our duty to remain here, a bulwark against the blight.'"
 
 tradition_nox_name:0 "Inhabitants of the Eternal Cities"
 tradition_nox_desc:0 "They are a grey-skinned, cold-blooded race known for wielding flowing weapons forged from the liquid metal of Silver Tears. Long ago they were banished deep underground, forced to live under a false night sky in eternal anticipation of the coming Age of the Stars, and of their Lord of Night."
 

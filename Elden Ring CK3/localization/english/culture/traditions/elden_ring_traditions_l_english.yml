 tradition_magic_incantation_two_fingers_desc:0 "We learned these ancient traditions from the Two Fingers of the Golden Order."
 tradition_magic_incantation_spiral_desc:0 "Power from the Crucible, given the perfect form to reach for the skies, the Spiral."
 tradition_magic_incantation_rot_desc:0 "An ancient god once existed, a god that was rot, this is a fragment of it's power."
 tradition_magic_incantation_order_desc:0 "Order is an strict set of rules that can have many forms, this is just our interpretation of them."
 tradition_magic_incantation_miquella_desc:0 "The teachings of Miquella guide us, no matter how far away we get from him."
 tradition_magic_incantation_messmers_flame_desc:0 "Messmer shared his flame with us. Even when we don't agree with his other teachings, his flame is now ours."
 tradition_magic_incantation_frenzy_desc:0 "The flame of frenzy, no matter how far away we get from it, it's a part of us now."
 tradition_magic_incantation_flame_desc:0 "Fire has many uses, all members of our culture learn how to use it."
 tradition_magic_incantation_erdtree_desc:0 "The Erdtree is a symbol of great power, living in it's shadow can teach many things. But sometimes when you look too closely, you see when all life was blended together."
 tradition_magic_incantation_dragon_cult_desc:0 "The ancient dragons were our teachers, some would even say that we keep what we learned too close to our hearts."
 tradition_magic_incantation_divine_beast_desc:0 "We don't worship the Divine Beast and the Crucible like the Hornsent do, but the dance of the beast is an aspect of our life."
 tradition_magic_incantation_dragon_communion_desc:0 "Eating the heart of a dragon is more than just taking a bite, the correct rituals we learned from the ancient dragons will help us not be destroyed by the power in the hearts."
 tradition_magic_incantation_crucible_desc:0 "While omen are not common for us, we are blessed by the Crucible. We know how to manifest it's power like the ancients did, horns, wings, scales and flames."
 tradition_magic_incantation_blood_desc:0 "The power of blood is often forgotten, but anyone that wants to use it just needs the ambition."
 tradition_magic_incantation_blackflame_desc:0 "There is fire augmented by the power of the rune of death, a devastating flame that could be used to slay gods. It is our tool."
 tradition_magic_incantation_bestial_desc:0 "We learned the ancient techniques of the beastmen, requiring low faith, but manifesting the power of a true beast."
 
 tradition_magic_sorcery_night_desc:0 "We learn the secrets of the Nox and the ancient cities. The power to control the night."
 tradition_magic_sorcery_ice_desc:0 "While it's not common in most of the Lands Between, ice possess great power for those with the patience to use it."
 tradition_magic_sorcery_impenetrable_thorn_desc:0 "We learn a special sorcery created when faith gave us nothing. An imitation of the Scadutree's thorns."
 tradition_magic_sorcery_gravity_desc:0 "There are easier ways to manifest the power of the cosmos, but we specialize in how the cosmic objects interact with each other."
 tradition_magic_sorcery_gelmir_desc:0 "Fire has many uses and ways to manifest, we master the ones used long ago in Mount Gelmir, the power of Magma."
 tradition_magic_sorcery_finger_desc:0 "Why follow the wrong path created by the Marika and her Two Fingers? No, we decided to hear the voice of the true messenger of the Greater Will."
 tradition_magic_sorcery_death_desc:0 "There is power in death, and while there are many ways to manifest it, be it the rune of death, the death birds or ghostflame."
 tradition_magic_sorcery_claymen_desc:0 "Not much is known of the Claymen, but we consider their spellcraft important enough to be remembered."
 tradition_magic_sorcery_crystalian_desc:0 "Cristalians are wise being with deep knowledge of the primeval current, and they were generous enough to teach us their ways."
 tradition_magic_sorcery_bloodthorn_desc:0 "Long ago there were sorcerous criminals that had their eyes gouged out by thorns, in their blindness they learned these sorceries from the Blood Star."
 tradition_magic_sorcery_carian_desc:0 "While glintstone sorcery has many uses, we specialize in using them for war, using the techniques of the enchanted knights that served Caria."
 tradition_magic_sorcery_glintstone_desc:0 "We learned the widely accepted teachings of the Academy of Raya Lucaria, this is the power gained by those that walk the path of sorcery."
 
 
 building_type_placidusax_throne: "$building_placidusax_throne$"
 building_type_placidusax_throne_desc: "$building_placidusax_throne_desc$"
 building_placidusax_throne_01: "Throne of Palcidusax"
 building_placidusax_throne_desc_01: "Here, at the heart of Farum Azula, stands the great seat of Dragonlord Palcidusax. Though, like the rest of the ancient city, it fell into disrepair, it may one day once more be a seat worthy of a king - or perhaps even a god."

 building_type_dragon_temple: "$building_dragon_temple$"
 building_type_dragon_temple_desc: "$building_dragon_temple_desc$"
 building_dragon_temple_01: "Dragon Temple"
 building_dragon_temple_desc_01: "The great and ancient Dragon Temple of Farum Azula is one of the best preserved areas of the ancient city. Though its ancient use has been lost to history, it may yet be repaired and reclaim its place as the greatest temple of the Lands Between." 


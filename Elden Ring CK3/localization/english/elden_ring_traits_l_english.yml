 trait_order_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Order, an strict ideology that doesn't allow imperfections or threats to it, but most things can be conjoined, as long as they become subservient."
 trait_frenzy_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity with the Frezied Flame, an origin of Madness and Chaos, and they are willing to Incinerate all that divides and distinguishes. May chaos take the world!"
 trait_glintstone_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Glintstone and Magic, they look at the night sky and try to understand the celestial bodies, forever searching for their secrets."
 trait_rot_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Rot and Poison, resisting them, but at the same time being attracted to them, they are a beautiful and horrifying power."
 trait_erdtree_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity with the Erdtree, blending in the ancient erdtree arts with aspects of the crucible."
 trait_fire_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for fire, it can have many origins and used in many ways, fire is a flexible tool. it can be used to forge, invigorate and cleanse the self, or destroy."
 trait_ice_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for cold sorceries, their have the power to inflict frostbite, using weapons made of ice amd a freezing mist."
 trait_gravity_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for gravitatinal sorceries, they revolve around the ability to hurl rocks or summon meteorites by using gravity to deal damage."
 trait_lightning_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Dragon Cult Incantations used by adherents to the ancient dragon cult and revolve around mostly Lightning-based attacks gifted from the Ancient Dragons to deal damage."
 trait_death_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Death Sorceries, they revolve around Those Who Live in Death and other undead creatures and forces to deal magic damage."
 trait_blood_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Blood Incantations, they revolve around the use of fiery blood as a weapon or enhancement to deal damage."
 trait_dragon_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for the natural aptitude of the Ancient Dragons."
 trait_blackflame_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for Godskin Apostle Incantations, they revolve around drawing power from the god-slaying blackflame to deal damage."
 trait_bestial_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for using Bestial incantations, they center on using strength to do damage, they were used by the beast clergy of Farum Azula."
 trait_sleep_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for artifacts and weapons that relate to sleep, they have an easier time resting their mind and body, and are very friendly."
 trait_spiral_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for the Crucible that is more controled, and centered on reaching the divine power of the gods."
 trait_magma_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for the Magma sorceries of Gelmir."
 trait_carian_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for the traditional sorceries of the Carian family."
 trait_claymen_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for the arts of the Ancient Dynasty."
 trait_night_affinity_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has an Affinity for arts of the Eternal Cities."

 trait_grafting:0 "Grafter"
 trait_grafting_2:0 "Intermediate Grafter"
 trait_grafting_3:0 "Fearsome Grafter"
 trait_grafting_4:0 "Monstrous Grafter"
 trait_grafting_5:0 "Obscene Grafter"
 trait_grafting_6:0 "Inhuman Grafter"
 trait_grafting_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has turned to the arts of Grafting."
 trait_grafting_2_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has grafted a few individuals onto [ROOT.GetCharacter.GetHerHis] body."
 trait_grafting_3_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has grafted numerous individuals onto [ROOT.GetCharacter.GetHerHis] body."
 trait_grafting_4_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has grafted a great many individuals onto [ROOT.GetCharacter.GetHerHis] body."
 trait_grafting_5_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has grafted countless individuals onto [ROOT.GetCharacter.GetHerHis] body."
 trait_grafting_6_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]'s grafting knows no bounds. They can hardly be called human anymore."
 trait_track_grafting:0 "Grafting"
 trait_track_grafting_desc:0 "Are you going to keep grafting innocents..."

 trait_nugget:0 "Lost Limbs"
 trait_nugget_character_desc:0 "Whether lost in battle or ill fortune, [ROOT.GetCharacter.GetFirstNameNoTooltip] is without both leg and arm."

 trait_tarnished:0 "Tarnished"
 trait_tarnished_desc:0 "Exiles who lost the grace of gold long ago, they now come back to the Lands Between guided by grace, to stand before the Elden Ring. And chance to become the Elden Lord.\nThis one is guided by ambition and grace."
 trait_graceless_tarnished:0 "Graceless Tarnished"
 trait_graceless_tarnished_desc:0 "Exiles who lost the grace of gold long ago, they now come back to the Lands Between guided by grace, to stand before the Elden Ring. And chance to become the Elden Lord.\nThis one had their ambition extinguished."

 trait_roundtable_leader:0 "Leader of the Roundtable Hold"
 trait_roundtable_leader_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is the current leader of the Roundtable Hold, a place where [GetTrait('tarnished').GetName( GetNullCharacter )] gather in their quest for the Elden Ring."

 trait_scarlet_rot:0 "Scarlet Rot"
 trait_scarlet_rot_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has caught a terrible and ancient affliction which is consuming [ROOT.GetCharacter.GetHerHis] body, leaving [ROOT.GetCharacter.GetHerHim] with a deformed appearance and terrible nightmares."

 trait_scarlet_rot_child:0 "Child of the Rot"
 trait_scarlet_rot_child_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a child of Rot, having been born from a sprouting bud in the heart of Caelid."

 trait_no_marry:0 "Refusing Marriage"
 trait_no_marry_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is for one reason or another refusing to marry."

 trait_perfumer:0 "Perfumer"
 perfumer_1_desc:0 "They begin [ROOT.GetCharacter.GetHerHis] journey in the world of perfuming, making diverse solutions to aid those who are sick and in pain."
 perfumer_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] begins [ROOT.GetCharacter.GetHerHis] journey in the world of perfuming, making diverse solutions to aid those who are sick and in pain."
 perfumer_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has glimpsed the nefarious potential of the perfumes, and starts to study more and more their effects on the body."
 perfumer_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has been corrupted by the perverse nature of [ROOT.GetCharacter.GetHerHis] work, which has caused him to fall into depravity and sin."
 trait_track_perfumer:0 "Perfumer's Knowledge"
 trait_track_perfumer_desc:0 "The path of transforming compunds into perfumes with many effects."

 trait_manserpent:0 "Manserpent"
 trait_manserpent_desc:0 "It is said that long ago, the elder serpent that dwelled on Mt. Gelmir devoured a demigod, and the birth of the man-serpents followed."

 trait_albinauric:0 "Albinauric"
 trait_albinauric_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is an artificial creature living an impure life untouched by grace. [ROOT.GetCharacter.GetHerHis] fate is the same as for all Albinaurics; to slowly lose [ROOT.GetCharacter.GetHerHis] legs and wither away."

 trait_god_serpent:0 "God-Devouring Serpent"
 trait_god_serpent_desc:0 "Neither man nor god, [ROOT.GetCharacter.GetFirstNameNoTooltip] has become nothing short of an abomination. His hunger will not be quenched until his death or until he has devoured all in this world."
 

 trait_sorcery_glintstone_4_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is quite skilled in Glintstone sorcery, and should not be taken lightly."
 trait_sorcery_glintstone_5_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is an expert in Glintstone sorcery, having mastered many aspects of the art."
 trait_sorcery_glintstone_6_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip]'s knowledge of Glintstone sorceries is unparalleled, with only a select few being their equal in the field."

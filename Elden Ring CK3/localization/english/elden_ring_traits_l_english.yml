 trait_snow_witch:0 "Snow Witch"
 trait_Snow_witch_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has learned to use spells related to snow and ice, they are called colds sorceries."

 trait_fire_monk:0 "Fire Monk"
 trait_fire_monk_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has learned to use spells related fire, they can be used to attack or to boost their body."

 trait_godskin_apostle:0 "Godskin Apostle"
 trait_godskin_apostle_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has mastered their black flame, a power that once could be used to slay gods, now it´s just a weapon to destroy armies."

 trait_black_assassin:0 "Black Knife Assassin"
 trait_black_assassin_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has a conection to death, it gives her the ability to cause death even to the immortals."

 trait_death_companion:0 "Deathbed Companion"
 trait_death_companion_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has a conection to death, any one embraced by her can feel every pulse, every bit of her warmth while losing theirs."

 trait_sanguine_noble:0 "Sanguine Noble"
 trait_sanguine_noble_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has declared themselves or was awarded the title of noble blessed by accursed blood."

 trait_lord_of_blood:0 "Lord of Blood"
 trait_lord_of_blood_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] declared themselves the Lord of Blood, they caouse terror in the heart of the weak becouse of their desire for wounds."

 more_than_twenty_prowess:0 "Have more than 20 Prowess"

 trait_sleep_cleric:0 "Sleep Cleric"
 trait_sleep_cleric_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a cleric of sleep, triying to use elixirs and weapons thay cause their enemies to fall asleep."
 trait_beast_clergy:0 "Beast Cleric"
 trait_beast_clergy_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] uses their learning in bestial incantations to deal physical damage, they center around primal and feral abilities."
 trait_horned_warrior:0 "Horned Warrior"
 trait_horned_warrior_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a warrior that uses the connection to the Crucible to invoke divinity, and use it to bolsters their strength."
 trait_divine_beast_warrior:0 "Divine Beast Warrior"
 trait_divine_beast_warrior_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a great warrior that has mastered using the power of the Crucible to invoke divinity, the way they use the power of the Crucible resembles a spiral."

 trait_misbegotten_trait:0 "Misbegotten"
 trait_track_horns:0 "Horns"
 trait_track_horns_desc:0 "Horns surround their body"
 trait_track_feather:0 "Feathers"
 trait_track_feather_desc:0 "Feathers grow from their back"
 trait_track_tail:0 "Tail"
 trait_track_tail_desc:0 "They have a strong Tail"
 trait_track_scales:0 "Scales"
 trait_track_scales_desc:0 "Scales cover their arms and shoulders"

 trait_omen_horn_trait:0 "Omen"
 trait_omen_no_horn_trait:0 "Hornless Omen"

 trait_ancient_dragon_elden_ring:0 "Ancient Dragon"
 trait_lesser_dragon_elden_ring:0 "Drake"

 trait_misbegotten_trait_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] was born with the power of the Crucible, it can be seen as a blessing or curse depending on how it's used."
 trait_omen_horn_trait_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] was born as a Omen, with great physical strength and horns protecting their body, sadly their horns get in the way of everyday life."
 trait_omen_no_horn_trait_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] had their horns excised painfully, their life forever changed, for better or worse it's for their faith to decide."
 trait_ancient_dragon_elden_ring_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a great Dragon, a being that has truly been blessed by the crucible, they have control over red lightning and can teach about dragon communion."
 trait_lesser_dragon_elden_ring_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a lesser Dragon, a pale imitation of the ancient ones, but still a powerful creature."


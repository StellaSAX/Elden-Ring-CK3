 er_artifacts.0001.desc:0 "The time has come for my to use all the runes i have colected to create a Great Rune, a representation of my power, a tool nedded to become the God of my own order or to mend the Elden Ring."
 er_artifacts.0001.title:0 "Creating a Great Rune"
 er_artifacts.0001.a:0 "A rune to help me in the wars to come."
 er_artifacts.0001.b:0 "A rune to help me oversee my realm."
 er_artifacts.0001.c:0 "A rune to help me understand the truth."
 er_artifacts.0001.d:0 "A rune to help me maintain peace."

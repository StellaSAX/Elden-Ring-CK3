 ### Prosthesis
 wear_prosthesis_decision:0 "Wear Prosthesis"
 wear_prosthesis_decision_desc:0 "A finely crafted false limb awaits fitting. Though costly, it restores both dignity and strength to one who has lost much."
 wear_prosthesis_decision_tooltip:0 "Install a masterwork prosthesis, restoring mobility and martial capability."
 wear_prosthesis_decision_confirm:0 "I will rise anew with this false limb."

 remove_prosthesis_decision:0 "Remove Prosthesis"
 remove_prosthesis_decision_desc:0 "The false limb may be removed, though doing so leaves one once again reliant upon will alone."
 remove_prosthesis_decision_tooltip:0 "Remove your false limb."
 remove_prosthesis_decision_confirm:0 "I will rely on my own strength once more."

 wear_prosthesis_title:0 "The Fitting of Steel"
 wear_prosthesis_desc:0 "Artisans prepare the false limb carefully. Leather straps are tightened, mechanisms aligned. As the final clasps are secured, balance returns — not as it once was, but strong enough."
 wear_prosthesis_option:0 "I rise anew."
 wear_prosthesis_cancel_option:0 "Not yet."

 god_serpent_decision:0 "Join the God-Devourer"
 god_serpent_decision_desc:0 "Long have the scorched highlands of Gelmir been haunted by the God-Devouring Serpent: a mighty monster revered by the locals for its seemingly immortal nature. I have long envied its power, its immortality and its greatness, yet even I, a demi-god, remain bound by the limits of my body. \n\nYet, in my mind, an idea has grown. One of pure madness, but perhaps just mad enough to work. I shall offer my body to the devourer of Gods! I shall claim its flesh as my own! Together, we shall devour the very #italic gods!#!"
 god_serpent_decision_tooltip:0 "You merge with the God-Devouring Serpent, becoming an abomination of pure sin and blasphemy."
 god_serpent_decision_confirm:0 "All shall join us as #italic family!#!"

 restore_raya_lucaria_decision:0 "Restoration of the Academy"
 restore_raya_lucaria_decision_desc:0 "The Carian nobles have maintained their tyrannical grip over the academy for far too long. Authority must be restored to its scholars, and leadership entrusted to those with the wisdom and merit to guide us forward."
 restore_raya_lucaria_decision_tooltip:0 "Seize control of the Academy from the clutches of the Carian nobles, back into the hands of the scholars. This will change you government to meritocratic."
 restore_raya_lucaria_decision_confirm:0 "Lets do it."
 er_major.0001.t:0 "Restoration of the Raya Lucaria Academy"
 er_major.0001.desc:0 "You did it!"
 er_major.0001.a:0 "Yipee! Yay for me!"
 er_major.0002.t:0 "Restoration of the Raya Lucaria Academy"
 er_major.0002.desc:0 "They did it!"


l_english:
 ruins_greatsword_name:0 "Ruins Greatsword"
 ruins_greatsword_description:0 "Originally rubble from a ruin which fell from the sky, this surviving fragment was honed into a weapon. One of the legendary armaments.\n\nThe ruin it came from crumbled when struck by a meteorite, as such this weapon harbors its destructive power."

 axe_of_godfrey_name:0 "Axe of Godfrey"
 axe_of_godfrey_description:0 "Weapon of Godfrey, Elden Lord. It was broken in a battle fought as leader of the Tarnished during the Long March.\n\nThis weapon is symbolic of Godfrey's vow to conduct himself as a lord, later becoming an emblem of the golden lineage. In the days of the past, a crown was warranted with strength."

 axe_of_godrick_name:0 "Axe of Godrick"
 axe_of_godrick_description:0 "Greataxe wielded by Godrick the Grafted. This golden battleaxe is emblazoned with the figure of a beast, representing the strength of Godfrey, First Elden Lord and patriarch of the golden lineage.\n\n#italic I command thee kneel! For I am the lord of all that is golden!#"

 eldenrune_death_name:0 "Rune of Death"
 eldenrune_death_description:0 "#italicThe Rune of Death goes by two names; the other is Destined Death. The forbidden shadow, plucked from the Golden Order upon its creation...#"

 greatrune_godrick_name:0 "Godrick's Great Rune"
 greatrune_godrick_description:0 "A Great Rune of the shardbearer Godrick. Its blessing raises all attributes.\n\nThis Great Rune is known as the anchor ring, found in the center of the Elden Ring.\n\nThe first demigods were The Elden Lord Godfrey and his offspring, the golden lineage."

 deathbed_smalls_name:0 "Deathbed Smalls"
 deathbed_smalls_description:0 "Skirt worn by Fia, the Deathbed Companion."
 
 elden_lord_crown_name:0 "Elden Lord Crown"
 elden_lord_crown_description:0 "Crown of Godfrey, the first Elden Lord.\n\nThe age of the Erdtree began amongst conflict, when Godfrey was lord of the battlefield.\n\nHe led the War against the Giants. Faced the Storm Lord, alone. And then, there came a moment. When his last worthy enemy fell. And it was then, as the story is told, that the hue of Lord Godfrey's eyes faded."
 
 godrick_crown_name:0 "Godrick's Crown"
 godrick_crown_description:0 "Forefathers one and all, bear witness!"
 
 queen_crescent_crown_name:0 "Queen's Crescent Crown"
 queen_crescent_crown_description:0 "A tall crown depicting the moon. Worn by Rennala, Queen of the Full Moon.\n\nWhen Rennala, head of both the Academy of Raya Lucaria and the Carian royal family, lost her husband Radagon, her heart went along with him.\n\nAnd then, those at the academy realized. That Rennala was no champion, after all."

 dragon_heart_name:0 "[dragon_fight.GetFirstName]'s Dragon Heart"
 dragon_heart_description:0 "Dragon heart gained by slaying a dragon.\nRiddled with Gravel Stone, this grotesque organ continues to beat vivaciously.\n\nAn offering used in the Dragon Communion. Consume a dragon's heart at the altar to make its power yours."
 
 banished_knight_greatsword_name:0 "Banished Knight's Greatsword"
 banished_knight_greatsword_description:0 "A finely-crafted greatsword intricately engraved with an ancient motif. Given to knights who, whether by misfortune or misdeed, were forced to abandon their homes.\n\nMost of these knights were sent to the fringes, where they were forced to start anew with only despair for company."
 
 lordsworn_straight_sword_name:0 "Lordsworn's Straight Sword"
 lordsworn_straight_sword_description:0 "Well-crafted straight sword with an illustrious design, wielded by regulars of a lord's army."
 
 noble_slender_sword_name:0 "Noble's Slender Sword"
 noble_slender_sword_description:0 "Narrow blade carried by wandering nobles. Made to be easy to wield.\n\nDaubed with gold from tip to tail, it should fetch a good sum."
 
 ornamental_straight_sword_name:0 "Ornamental Straight Sword"
 ornamental_straight_sword_description:0 "Slender straight sword patterned after an antique ornament. Superior swordsmen prefer to wield one in each hand.\n\nAfter falling from grace, the dregs of the golden lineage sought power and purpose in the past."
 
 carian_knight_sword_name:0 "Carian Knight's Sword"
 carian_knight_sword_description:0 "Straight sword embedded with a blue glintstone. Weapon of knights sworn to Carian royalty.\n\nThese knights' swords could serve as catalysts, letting them wield sorcerous battle skills. Despite numbering fewer than twenty, this power made them a match for even the champions of gold in battle."
 
 miquellan_knight_sword_name:0 "Miquellan Knight's Sword"
 miquellan_knight_sword_description:0 "Sword forged by servants of Miquella of the Haligtree, with a design modeled after those carried by Carian knights. Instead of glintstone however, amber from the Haligtree is embedded in the blade."
 
 sword_of_st_trina_name:0 "Sword of St. Trina"
 sword_of_st_trina_description:0 "Silver sword carried by clerics of St. Trina.\n\nSt. Trina is an enigmatic figure. Some say she is a comely young girl, others are sure he is a boy. The only certainty is that their appearance was as sudden as their disappearance."
 
 rogier_rapier_name:0 "Rogier's Rapier"
 rogier_rapier_description:0 "Piercing sword of superior quality, featuring intricate ornamentation. Signature weapon of the sorcerer Rogier."
 
 lordsworn_greatsword_name:0 "Lordsworn's Greatsword"
 lordsworn_greatsword_description:0 "Well-crafted greatsword with an illustrious design, wielded by regulars of a lord's army."
 
 knight_greatsword_name:0 "Knight's Greatsword"
 knight_greatsword_description:0 "Greatsword bestowed upon skilled swordsmen in the demigods' service, and yet had no rank or title."
 
 grafted_blade_greatsword_name:0 "Grafted Blade Greatsword"
 grafted_blade_greatsword_description:0 "The storied sword of Castle Morne. A revenger's weapon, it is burdened with oceans of anger and regret.\n\nA lone surviving champion from a country now vanished was so determined to continue fighting that he claimed the swords of an entire clan of warriors."
 
 dark_moon_greatsword_name:0 "Dark Moon Greatsword"
 dark_moon_greatsword_description:0 "A Moon Greatsword bestowed by a Carian queen upon her spouse to honor long-standing tradition."
 
 er_knight_armor_name:0 "Knight Armor"
 er_knight_armor_desc:0 "Iron armor of an unknown knight. It is made of thin iron plate. Such metal armor is heavy, but provides considerable damage negation."
 
 er_chain_armor_name:0 "Chain Armor"
 er_chain_armor_desc:0 "Armor made of woven chain. Standard issue for ordinary soldiers. Though plain in appearance, it offers dependable protection."

 reedlands_religion_adherent_plural:0 "Sword Artists"
 reedlands_religion_desc:0 "From the distant Land of Reeds across the sea come the Samurai who carry their own traditional faiths.\n\nRiddled by constant civil wars and brutal bloodshed, the Reedlanders venerate the art of martial prowess and their honor the ancestors that came before them. Tales have been told of devout swordsmen who renounced the absurdity of the world and with only themselves, their katana, and the mastery of the blade they become 'demons of the sword.'"
 

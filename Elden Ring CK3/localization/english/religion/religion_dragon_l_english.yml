 # Ancient Dragon-Group Faiths

 placidusax_cult:0 "The Ancient Dragons Faith"
 placidusax_cult_adj:0 "Dragon-Faith"
 placidusax_cult_adherent:0 "Communer"
 placidusax_cult_adherent_plural:0 "Communers"
 placidusax_cult_desc:0 "In the crumbling ruins of Farum Azula, believed to be a mausoleum built in honour of an ancient dragon, the Ancient Dragons await the return of their lord, Dragonlord Placidusax, whose seat lies beyond the bounds of time.\n\nChosen beastmen keep watch over the ruins, their weapons wreathed in lightning, while the priestess of the Dragon Communion bestows her blessings in the name of the Dragonlord, once Elden Lord, who has never abandoned his vigil for the return of his fled god.\n\nAmong mortal believers, the Dragon Communion is observed as a sacred rite, said to have been devised by Placidusax as retribution for Bayle the Dread's betrayal. Its warriors inherit the dragons' hatred for their lesser descendants, hunting the drakes of Bayle's bloodline and devouring their hearts at the altar to claim their power. Yet the Communion exacts a terrible price, gradually stripping its followers of their humanity. Those who surrender themselves entirely to its power are doomed to become wyrms, crawling across the earth."
 

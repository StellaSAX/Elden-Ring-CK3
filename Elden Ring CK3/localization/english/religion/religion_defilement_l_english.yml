 defilement_religion_desc:0 "A loathsome creed gestated in the sewer-gaol beneath the Royal Capital, Defilement teaches that the Omen — the unsightly blessing of horns and deformity — ought to be spread to every living soul, so that none may be singled out as impure.\n\nIts adherents kill and defile the dead to cultivate the Seedbed Curse within them, that every child yet to be born shall come cursed, and that one day a Loathsome Rune might arise to defile the Order itself."

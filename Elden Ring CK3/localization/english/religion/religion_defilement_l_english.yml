 # Defilement-Group Faiths

 seedbed_cult:0 "Seedbed Cult"
 seedbed_cult_adj:0 "Seedbed"
 seedbed_cult_adherent:0 "Seedbed"
 seedbed_cult_adherent_plural:0 "Seedbeds"
 seedbed_cult_desc:0 "Adherents of the Dung Eater's loathsome guidance, the Seedbed Cult kill and defile corpses so that the Omen curse might grow within them, spreading without end to every child born hereafter.\n\nThey recognise no brotherhood among themselves, each defiler walking his own cursed path in silence, yet all share the conviction that a world uniformly defiled is a world, at last, made equal."

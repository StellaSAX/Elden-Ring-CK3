 rot_religion_desc:0 "An old legend grown into worship, the Order of Rot venerates the scarlet bloom as a holy thing. An Outer God's gift gestated in the body of Malenia, Blade of Miquella, who at last would bloom into the Goddess of Rot.\n\nTo those enraptured, the rotted vestments are holy robes that root one to the earth; decay is not an ending but a flowering, and each sickened soul is a bud awaiting its final, scarlet bloom."


 spirits_religion_adherent_plural:0 "Ancestral Followers"
 spirits_religion_desc:0 "Dwelling in the hidden underground of the Lands Between, far from the light of the Erdtree, the Ancestral Followers hold that the horns of a long-lived beast continue to bud like antlers, over and over, until at last the beast becomes an ancestral spirit.\n\nThey disdain metal, fashioning axes from herbivore skulls and bows from horn, and live patiently at a distance from the Erdtree's reach, awaiting the new buds that are certain to sprout from their own flesh, and indeed from their souls."


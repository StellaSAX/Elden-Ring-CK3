 # Ancestral-Group Faiths

 faith_ancestor_spirit:0 "The Ancestral Followers"
 faith_ancestor_spirit_adj:0 "Ancestral"
 faith_ancestor_spirit_adherent:0 "Ancestral Follower"
 faith_ancestor_spirit_adherent_plural:0 "Ancestral Followers"
 faith_ancestor_spirit_desc:0 "The faith of those who dwell along the Siofra, organised into two callings: the warriors, decked in headbands of great horns and raiment of bristly pelt, who wield horn-clubs and skull-axes; and the shamans, crowned with shining horns, who tend the rites by which the budding is hastened and the ancestors are remembered.\n\nTheir master hunters, bearing longbows whittled from animal horn, walk the furthest from the Erdtree's light, that the next bud may bloom untroubled."


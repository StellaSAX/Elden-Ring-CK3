l_english:
 
 other_religion:0 "Other Faiths"
 other_religion_adj:0 "Other"
 other_religion_adherent:0 "PLACEHOLDER"
 other_religion_adherent_plural:0 "PLACEHOLDER"
 other_religion_desc:0 "The Other faiths are those that exist outside and often in opposition to both the Golden Order and the ancient Crucible traditions. Many are tied to the Outer Gods; vast and alien intelligences that press against the edges of the Lands Between while others preserve older ways that simply never aligned with the Order's vision of the world."

 faith_fell:0 "Fell Order"
 faith_fell_adj:0 "Fell"
 faith_fell_adherent:0 "Fell Disciple"
 faith_fell_adherent_plural:0 "Fell Disciples"
 faith_fell_desc:0 "Predating the Erdtree, the Fell God is an nameless outer god that the Fire Giants followed, who tended to the god's eternal flame in the great forge on the Mountaintop of the Giants. The Golden Order claims that the Fell God was slain during the War Against the Giants, but in reality he remains dormant and on the cusp of being awakened as his embers still dwell within the forge of Flame Peak."

 faith_formless:0 "Formless Mother"
 faith_formless_adj:0 "Formless"
 faith_formless_adherent:0 "Servant of the Formless Mother"
 faith_formless_adherent_plural:0 "Servants of the Formless Mother"
 faith_formless_desc:0 "The Formless Mother is an omnipresent Outer God of blood; an entity without shape or fixed nature that craves wounds and communicates through hemorrhage and offerings. The Mohgwyn Dynasty was built in her name, and her patronage flows through the blood of those she favors."

 faith_rot:0 "Order of Rot"
 faith_rot_desc:0 "The Order of Rot is a blanket term for any number of sects that worship the Outer God of Rot, an inscrutable entity associated with death, decay, and rebirth. The servants of Rot see the boiling red affliction cast on them by their master as a blessing that could create life from death and grant rebirth to those who submit to it. In ancient times, practitioners would let their infected bodies become encrusted by mushrooms which they saw as a means of binding themselves to the earth and to that most sacred process of decay. In time, however, their god would be sealed away, and the servants of Rot would soon learn that their new master wanted nothing to do with them."
 faith_rot_adj:0 "Order of Rot"
 faith_rot_adjerent:0 "Servant of Rot"
 faith_rot_adherent_plural:0 "Servants of Rot"

 faith_old_death:0 "Old Faith of Death"
 faith_old_death_adj:0 "Old Death"
 faith_old_death_adherent:0 "Death Priest"
 faith_old_death_adherent_plural:0 "Death Priests"
 faith_old_death_desc:0 "Before Marika stripped the Rune of Death from the Elden Ring, death was a natural and complete thing as souls passed through the Erdtree and were returned to the cycle. The Old Faith of Death venerates this original order, when death meant something, when it carried a dignity that Marika's reign stripped away. They believe that should the Rune of Death be restored to the Elden Ring, an 'Age of Duskborn' shall restore death to the Lands Between and ridding the realm of stagnant immortality."

 faith_frenzy:0 "Frenzied Flame"
 faith_frenzy_desc:0 "Believing that existence is pain, the frenzied worship the frenzied flame in order to burn the old world away, and do away with the eternal suffering of the masses by becoming one again through it. They desperately await the chosen of the three fingers, servant of the flame, to burn at the center of the erdtree and finally end it all."
 faith_frenzy_adj:0 "Frenzied"
 faith_frenzy_adherent:0 "Frenzied Follower"
 faith_frenzy_adherent_plural:0 "Frenzied Followers"

 faith_reedlander:0 "Art of the Blade"
 faith_reedlander_adj:0 "Art of the Blade"
 faith_reedlander_adherent:0 "Sword Artist"
 faith_reedlander_adherent_plural:0 "Sword Artists"
 faith_reedlander_desc:0 "From the distant Land of Reeds across the sea come the Samurai who carry their own traditional faiths.\n\nRiddled by constant civil wars and brutal bloodshed, the Reedlanders venerate the art of martial prowess and their honor the ancestors that came before them. Tales have been told of devout swordsmen who renounced the absurdity of the world and with only themselves, their katana, and the mastery of the blade they become 'demons of the sword.'"
 destined_death_religion:0 "Destined Death"
 destined_death_religion_adj:0 "Destined Death"
 destined_death_religion_adherent:0 "Destined Death Adherent"
 destined_death_religion_adherent_plural:0 "Destined Death Adherents"
 destined_death_religion_desc:0 "The decision to remove Death from the Elden Ring was not accepted by all. Some believe that Death is part of the natural order, and that Marika has made a mistake. They now seek to free the Rune of Death from Maliketh."
 
 faith_godslayer:0 "Godslayer Cult"
 faith_godslayer_adj:0 "Godslayer"
 faith_godslayer_adherent:0 "Godslayer Cultist"
 faith_godslayer_adherent_plural:0 "Godslayer Cultists"
 faith_godslayer_desc:0 "The Godslayers were an old order led by the Gloam-Eyed Queen. They used the Black Flame, powered by Destined Death, to slay Gods and skin them. However, they lost their power when Maliketh defeated them and sealed away the Rune of Death."

 primeval_current:0 "the Primeval Current"
 primeval_current_adj:0 "primeval"
 primeval_current_adherent:0 "primeval sorcerer"
 primeval_current_adherent_plural:0 "primeval sorcerers"
 primeval_current_desc:0 "The forbidden tradition of glintstone sorcery, holding that the discipline ought not to be trapped within the order of the academy but ought to belong to the stars themselves, as it did before the Erdtree and before the Golden Order. Its grand masters Azur and Lusat were driven from Raya Lucaria by Qeeun Rennala after gazing too deeply into the current; the one beheld darkness and the abyss, the other the dying of a great star cluster and they were broken by what they saw, until both had reached a near-inorganic state.\n\nThose who cleave to its teachings hold that the collecting of sorcerers, to fashion them into the seeds of stars, is but another path of scientific inquiry. They name themselves the fallen children, and the highest of their hopes is that they shall one day shine, and become children of the stars."


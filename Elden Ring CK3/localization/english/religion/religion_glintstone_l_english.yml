 # Glintstone Scholarship-Group Faiths

 raya_lucaria:0 "Lucarian Orthodoxy"
 raya_lucaria_adj:0 "Lucarian"
 raya_lucaria_adherent:0 "Lucarian scholar"
 raya_lucaria_adherent_plural:0 "Lucarian scholars"
 raya_lucaria_desc:0 "The orthodox tradition of the Academy of Raya Lucaria, ordered into the lineages it calls conspectuses; Karolos for the mysteries of comets, Olivinus for the study of meteors, Twinsage for the elites who would master sorceries of every kind, Haima for those who would quell conflict by gavel and cannon-fire, and the heterodox Lazuli, a Carian addition to the academy's curriculum, for those who hold the moon to be equal to the stars.\n\nWithin the academy, status is borne upon the brow; the glintstone crowns are bestowed only upon those whose pursuits the academy has deemed worthy, and the highest of those crowns belong to its grand masters. Those whose research strays beyond the wisdom of stone are reminded by exile, or by seal that not every star is meant to be looked upon directly."


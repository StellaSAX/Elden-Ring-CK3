 academia_religion:0 "Glintstone Scholarship"
 academia_religion_adj:0 "Lucarian"
 academia_religion_adherent:0 "scholar"
 academia_religion_adherent_plural:0 "scholars"
 academia_religion_desc:0 "It is not a faith, properly speaking, but the closest thing to one practised by the academies of Liurnia; the patient and ordered study of the stars, of the glintstone in which their light is held, and of the sorceries that may be drawn from both.\n\nIts adherents do not pray, but observe. They do not worship any God, but record. The stars are not their gods, but their subject, although it is true that some, gazing too long into the depths beyond, have ceased to be sure of the difference."


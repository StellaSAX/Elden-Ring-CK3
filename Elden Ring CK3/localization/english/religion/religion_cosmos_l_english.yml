 faith_academy:0 "Academia of Raya Lucaria"
 faith_academy_adj:0 "Lucarian Academia"
 faith_academy_adherent:0 "Lucarian Scholar"
 faith_academy_adherent_plural:0 "Lucarian Scholars"
 faith_academy_desc:0 "The Academy of Raya Lucaria institutionalized sorcery and primarially pursues the study of glintstone, founded by the primeval sorcerers Azur and Lusat. Later, Queen Rennala would become the Academy's master and would heavily limit the study of the primeval current and exiled Azur and Lusat."

 faith_primeval:0 "Primeval Current"
 faith_primeval_adj:0 "Primeval"
 faith_primeval_adherent:0 "Sorcerer"
 faith_primeval_adherent_plural:0 "Sorcerers"
 faith_primeval_desc:0 "The oldest path to glintstone sorcery, and the one offers the most power as long as you are willing to sacrifice others and yourself to understand it."

 faith_night:0 "Night Sorcery"
 faith_night_adj:0 "Night"
 faith_night_adherent:0 "Sorcerer"
 faith_night_adherent_plural:0 "Sorcerers"
 faith_night_desc:0 "A dark path based on the teaching of the Eternal Cities. These sorceries were perfected by the people of Sellia the town of sorcery. Those that descend from the Nox."
 
 academy_rite:0 "Glintstone Sorcery"
 academy_rite_adj:0 "Glintstone"
 academy_rite_desc:0 "The main teachings of the Academy, based on the undertanding of Glinstone, the amber of the cosmos that contains the vitality of the stars."
 academy_rite_adherent:0 "Badlander"
 academy_rite_adherent_plural:0 "Badlander"
 
 gravity_rite:0 "Gravity Sorcery"
 gravity_rite_adj:0 "Gravity"
 gravity_rite_desc:0 "A less practiced form of sorcery, mainly teached by the Alabaster and Onyx Lords. It grants the user the power to gravity, and a true master could even use it to challenge the stars."
 gravity_rite_adherent:0 "Badlander"
 gravity_rite_adherent_plural:0 "Badlander"
 
 primeval_rite:0 "Primeval Sorcery"
 primeval_rite_adj:0 "Primeval"
 primeval_rite_desc:0 "The Origins of glintstone sorcery, these teaching are based on observing The Primeval Current. To those who cleave to its teachings, the act of collecting sorcerers to fashion them into the seeds of stars is but another path of scientific inquiry."
 primeval_rite_adherent:0 "Badlander"
 primeval_rite_adherent_plural:0 "Badlander"
 
 night_rite:0 "Night Sorcery"
 night_rite_adj:0 "Night"
 night_rite_desc:0 "These dark teachings are used by the people of Sellia, many of them assassins. They are based on some techniques used by the Nox."
 night_rite_adherent:0 "Badlander"
 night_rite_adherent_plural:0 "Badlander"
 tenet_golden_order_name:0 "The Governing Principle"
 tenet_golden_order_desc:0 "The Golden Order, made manifest by the Elden Ring, encompasses everything - our world and the very rules dictating its functions. We followers of the Golden Order share reverence for the Erdtree, Marika and her consort."
 tenet_unalloyed_order_name:0 "The Unalloyed Order"
 tenet_unalloyed_order_desc:0 "The Golden Order has faced meddling from the Outer Gods for too long. Following Miquella, we shall reject their influence and seek a peaceful existence, not based on violence but kindness instead."
 tenet_glintstone_name:0 "The Primeval Current"
 tenet_glintstone_desc:0 "The celestial bodies, including stars and especially the moon, possess inconceivable power. We need not rely on the Erdtree and Marika but instead study the night sky. Even so we must caution against glimpsing the unknowable and forbid magic outside of glintstone sorcery."
 tenet_destroy_golden_order_name:0 "Rejecting the Order"
 tenet_destroy_golden_order_desc:0 "The Golden Order is nothing but a farce and facade masquerading a dying world. We reject their “fundamental” laws! We will destroy the Order so a new world can be born in its ashes."
 tenet_golden_exile_name:0 "The Crusade"
 tenet_golden_exile_desc:0 "The Flame can be sacred when used against those who fall outside of the Erdtree’s grace. Our sacred mission from Marika remains: burn the Hornsent and impale the Divine Beasts! Not until then can we return to the Lands Between. "
 tenet_live_in_death_name:0 "Those Who Live in Death"
 tenet_live_in_death_desc:0 "We who have been touched by the Rune of Death patiently await the return of our Lord; Godwyn, the Prince of Death. With both halves of the Runes of Death united, we shall correct the flawed Elden Ring to instill the Those Who Live in Death in it!"
 
 tenet_dragon_cult_name:0 "Dragon Worship"
 tenet_dragon_cult_desc:0 "Long ago, Godwyn the Golden defeated the ancient dragon Fortissax, and befriended his fallen foe. The worship of the ancient dragons does not conflict with belief in the Erdtree. After all, lightning itself is imbued with gold."
 
 tenet_golden_order_syncretism_name:0 "Linked with Gold"
 tenet_golden_order_syncretism_desc:0 "The Golden Order is pliable enough to absorb practices that contradicted itself. As long as they are willing to kneel to it and accept it's God as an absolute ruler."
 
 tenet_st_trinas_blessing_name:0 "Blessing of Slumber"
 tenet_st_trinas_blessing_desc:0 "While resting, we have been visited by someone, a saint that gives us rest and succor. St Trina is an enigma, some say she is a comely young girl, others are sure he is a boy. But one thing is certain, they will bless us with eternal sleep."
 
 tenet_ancient_dragon_name:0 "Ancient Powers"
 tenet_ancient_dragon_desc:0 "The Ancient Dragons are the most powerful beings in the lands between, blessed by multiple aspects of the Crucible. During the ancient past they ruled the world unimpeded, and they might do it again."
 
 tenet_bayle_dragon_name:0 "Draconic Dread"
 tenet_bayle_dragon_desc:0 "Under the rule of Placidusax, we are just the `lessers`, having been born without the stone scales of our ancient kin. But Bayle promised us much more, a new age for us, where we will rule the world, we just have to take it by claw and flame."
 
 tenet_children_of_the_badlands_name:0 "Children of the Badlands"
 tenet_children_of_the_badlands_desc:0 "Our ancestors followed chieftain Hoarah Loux into the Badlands, and the lessons we learned in that unforgiving place must never be forgotten. We must be strong not only to survive, but to protect what is precious to us."
 
 tenet_frenzied_flame_name:0 "Flame of Frenzy"
 tenet_frenzied_flame_desc:0 "It is said that the sickness of the flame of frenzy began with Shabriri, the most reviled man in all history. 'Ahhh, may chaos take the world! May chaos take the world!'"
 
 tenet_giants_flame_name:0 "Giants' Flame"
 tenet_giants_flame_desc:0 "The flame of ruin is an ancient and inextinguishable fire. This power of the fell god is wielded as Giants' Flame incantations by Fire Giants and Fire Monks."
 
 tenet_great_spiral_name:0 "Spira"
 tenet_great_spiral_desc:0 "The spiral is a normalized Crucible current that, one day, will form a column that stretches to the gods. This ancient symbol belongs to the hornsent, the people of Belurat."
 
 tenet_rot_name:0 "Bud of Rot"
 tenet_rot_desc:0 "There are some tales of an ancient god that was rot itself. The death that begets life, that comes to all equally. That is to say: it is the cycle of rebirth put into practice."
 
 tenet_serpents_name:0 "Serpentine Deity"
 tenet_serpents_desc:0 "There are ancient tales of an Immortal Serpent living in Mount Gelmir, a being that can only be killed temporarily by a weapon known as the `Serpent-Hunter`. This ancient creature was venerated by a snake cult that offered human sacrifices to it."
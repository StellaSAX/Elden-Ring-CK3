 bm_8301_elden_ring_demigods:0 "The Ruin of the Demigods"
 bm_8301_elden_ring_demigods_desc:0 "The Shattering War, the great clash between the heirs of Marika after the unmaking of the Elden Ring, has come to a ruinous yet undecisive end. What demigods remain are but lords of squabbling petty kingdoms, far from the glory and might they once commanded. As the ashes fall and the rise of a new Elden Lord to rule over the Lands Between seems less certain than ever, will one of the line of Marika forge the Golden Order anew or are its days truly passed?"
 bm_8301_elden_ring_land_of_shadows:0 "The Land of Shadows"
 bm_8301_elden_ring_land_of_shadows_desc:0 "Miquella acting a bit sus lately. Find out what the dog doing."
 bm_8301_elden_ring_meek_or_forgotten:0 "The Meek and Forgotten"
 bm_8301_elden_ring_meek_or_forgotten_desc:0 "The fall of the gods to madness and decay has left much of the Lands Between in anarchy. The Golden Order is broken, the demigods are broken, the old world is broken. While this chaos may have brought great suffering to the Lands Between, to some it has brought great opportunity. In this new world, any man or woman with an army can make themselves a lord or, perhaps, even a god of their own new order..."
 bm_8301_elden_ring_regents:0 "The Regents"
 bm_8301_elden_ring_regents_desc:0 "As the demigods fell to madness and calamity, the lords under them were not idle. Across the Lands Between, regents of divine authority and power have arisen, using the names of the demigods to strike fear in their foes or as sources of legitimacy. Now, they are the ones that play their pieces in the great games of power. As the greatest warlords left in these chaotic times, many suspect that the true victor of the Shattering war will arise from their number. Who is left to challenge them, after all?"

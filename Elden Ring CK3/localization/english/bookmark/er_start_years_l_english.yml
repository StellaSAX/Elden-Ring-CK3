 bm_8301_elden_ring_demigods:0 "The Ruin of the Demigods"
 bm_8301_elden_ring_demigods_desc:0 "The Shattering War, the great clash between the heirs of Marika after the unmaking of the Elden Ring, has come to a ruinous yet undecisive end. What demigods remain are but lords of squabbling petty kingdoms, far from the glory and might they once commanded. As the ashes fall and the rise of a new Elden Lord to rule over the Lands Between seems less certain than ever, will one of the line of Marika forge the Golden Order anew or are it days truly passed?"
 bm_8301_elden_ring_land_of_shadows:0 "The Land of Shadows"
 bm_8301_elden_ring_land_of_shadows_desc:0 "Miquella acting a bit sus lately. Find out what the dog doing."
 bm_8301_elden_ring_meek_or_forgotten:0 "The Meek and Forgotten"
 bm_8301_elden_ring_meek_or_forgotten_desc:0 "Bunch of weird people, put their foolish ambitions to rest instead."
 bm_8301_elden_ring_regents:0 "The Regents"
 bm_8301_elden_ring_regents_desc:0 "Radahn is eating, Malenia is sleeping, Rykard is TOGETHAAAAA and Rennala is holding an egg. Time to let the underdogs shine."

 #Morgott
 bookmark_morgott_elden_ring:0 "Morgott, The Omen King"
 bookmark_morgott_elden_ring_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_morgott_elden_ring_desc:0 "Morgott, a cursed Omen of royal blood, rules over the ruins of Leyndell. Though he is secure in his halls, few are those who see him as more than a regent of his city, his insistance on upholding the Golden Order despite his Omen birth having brough him little loyalty. For now, Morgott, Last of All Kings, rules through strength but that strength is not great enough to make him Elden Lord. \n\nWill Morogtt forge himself a place of power in the Golden Order or is he doomed to see his world come crashing down?"

 #Rykard
 bookmark_rykard_elden_ring:0 "Rykard, Lord of Blasphemy"
 bookmark_rykard_elden_ring_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_rykard_elden_ring_desc:0 "Rykard, once one of the many demigods figthing to become Elden Lord, has grown into a being both greater and more terrible. Taking the flesh of the eternal God-Devouring Serpent, Rykard embraced pure sin and blasphemy. Though this crime against nature has left him deeply isolated and despised by all but his mad followers, Rykard's intent to make himself Elden Lord has not wavered. \n\nRykard has the power to devour the very gods, yet his rise is far from certain. Will blasphemy rise to conquer the Lands Between or will the Devourer of Gods fall by the hands of his many foes?"
 